<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCoach Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: white;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; }
        .card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 25px; margin-bottom: 20px;
        }
        .workout-item {
            background: rgba(255, 255, 255, 0.2); padding: 15px;
            border-radius: 12px; margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 FitCoach Pro</h1>
        <div class="card">
            <h2>Тренировка на сегодня</h2>
            <div class="workout-item"><h3>🏃 Разминка</h3><p>5 минут</p></div>
            <div class="workout-item"><h3>💪 Приседания</h3><p>3 по 15</p></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Создаем кнопку
        tg.MainButton.setText("🚀 НАЧАТЬ ТРЕНИРОВКУ");
        tg.MainButton.show();
        tg.MainButton.enable();

        // При нажатии отправляем данные через ОБЫЧНОЕ текстовое сообщение
        tg.MainButton.onClick(function() {
            tg.MainButton.setText("✅ ОТПРАВЛЕНО!");
            tg.MainButton.color = "#2ecc71";
            
            // Отправляем как обычный текст — это ГАРАНТИРОВАННО дойдет до бота
            tg.sendData('start_workout');
            
            // Дополнительно закрываем приложение через 1 секунду
            setTimeout(() => {
                tg.close();
            }, 1000);
        });
    </script>
</body>
</html>
