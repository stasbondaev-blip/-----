<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitCoach Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: white;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 28px; }
        .card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 25px; margin-bottom: 20px;
        }
        .btn {
            background: white; color: #667eea; border: none; padding: 15px 30px;
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            width: 100%; margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 FitCoach Pro</h1>
        <div class="card">
            <h2>Тренировка на сегодня</h2>
            <button class="btn" id="startBtn" onclick="startWorkout()">Начать тренировку</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        function startWorkout() {
            const btn = document.getElementById('startBtn');
            btn.innerText = '⏳ Отправка...';
            btn.style.background = 'yellow';
            
            // Пробуем sendData
            tg.sendData('start_workout');
            
            // Если sendData не работает, закрываем приложение
            setTimeout(() => {
                tg.close();
            }, 500);
        }
    </script>
</body>
</html>
