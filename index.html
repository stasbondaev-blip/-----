<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitCoach Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; padding: 20px; color: white;
        }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 30px; font-size: 28px; }
        .card {
            background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(10px);
            border-radius: 20px; padding: 25px; margin-bottom: 20px;
        }
        .card h2 { font-size: 20px; margin-bottom: 15px; }
        .workout-item {
            background: rgba(255, 255, 255, 0.2); padding: 15px;
            border-radius: 12px; margin-bottom: 10px;
        }
        .workout-item h3 { font-size: 16px; margin-bottom: 5px; }
        .workout-item p { font-size: 14px; opacity: 0.9; }
        .btn {
            background: white; color: #667eea; border: none; padding: 15px 30px;
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer;
            width: 100%; margin-top: 10px; transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-item { text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 12px; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💪 FitCoach Pro</h1>
        <div class="card">
            <h2>Тренировка на сегодня</h2>
            <div class="workout-item"><h3>🏃 Разминка</h3><p>5 минут легкого кардио</p></div>
            <div class="workout-item"><h3>💪 Приседания</h3><p>3 подхода по 15 повторений</p></div>
            <div class="workout-item"><h3>🔥 Отжимания</h3><p>3 подхода по 10 повторений</p></div>
            <button class="btn" onclick="startWorkout()">Начать тренировку</button>
        </div>
        <div class="card">
            <h2>Твой прогресс</h2>
            <div class="stats">
                <div class="stat-item"><div class="stat-number">12</div><div class="stat-label">Тренировок</div></div>
                <div class="stat-item"><div class="stat-number">5</div><div class="stat-label">Дней подряд</div></div>
            </div>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        function startWorkout() {
            tg.showAlert('Тренировка началась! 💪');
        }
    </script>
</body>
</html>
